replicaCount: 1
revisionHistoryLimit: 3

webdavd:
  enabled: true
  port: 8081

httpd:
  enabled: true
  port: 8080

ui:
  ingress:
    enabled: true
    className: "traefik"
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect@kubernetescrd
    hosts:
      - host: sftpgo.gavriliu.com
        paths:
          - path: /
            pathType: ImplementationSpecific

persistence:
  enabled: true
  annotations: {}
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi
    storageClassName: "longhorn"
